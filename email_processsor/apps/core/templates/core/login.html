<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Flow – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 420px; border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.10); border-radius: 12px; overflow: hidden; }
    .login-header { background-color: #212529; color: #fff; padding: 2rem; text-align: center; }
    .login-header .brand { font-size: 1.3rem; font-weight: 600; }
    .login-body { padding: 2rem; background: #fff; }
    .btn-login { background-color: #212529; color: #fff; width: 100%; }
    .btn-login:hover { background-color: #343a40; color: #fff; }
    .form-control:focus { border-color: #212529; box-shadow: 0 0 0 0.2rem rgba(33,37,41,0.15); }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <div class="brand"><i class="bi bi-envelope-fill me-2"></i>Email Flow</div>
      <div class="text-secondary mt-1" style="font-size:0.85rem;">Sign in to your dashboard</div>
    </div>
    <div class="login-body">
      {% if form.errors %}
        <div class="alert alert-danger py-2" role="alert">
          <i class="bi bi-exclamation-circle me-1"></i> Invalid mail ID or password.
        </div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_username" class="form-label fw-semibold">Mail ID</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="username" id="id_username" class="form-control" placeholder="you@example.com" autofocus required>
          </div>
        </div>
        <div class="mb-4">
          <label for="id_password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login">Sign In</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
